<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Primary blue background -->
  <rect width="512" height="512" rx="100" fill="#1652F0"/>

  <!-- Stylised "S" built from three pill-shaped bars (think data rows / ledger lines) -->
  <!-- Top pill — right-anchored -->
  <rect x="156" y="148" width="200" height="56" rx="28" fill="white"/>
  <!-- Middle pill — full width, slightly transparent -->
  <rect x="156" y="228" width="200" height="56" rx="28" fill="white" opacity="0.55"/>
  <!-- Bottom pill — left-anchored -->
  <rect x="156" y="308" width="200" height="56" rx="28" fill="white"/>

  <!-- Mask the left side of the top pill to make it feel open/S-like -->
  <rect x="156" y="148" width="56" height="56" fill="#1652F0"/>
  <!-- Mask the right side of the bottom pill -->
  <rect x="300" y="308" width="56" height="56" fill="#1652F0"/>

  <!-- Small accent circle — top right, like a notification dot -->
  <circle cx="376" cy="148" r="24" fill="#0AAF60"/>
</svg>
